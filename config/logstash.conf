
input {
  kafka {
    bootstrap_servers => "kafka:19092"
    topics => ["topic2", "topic2-run01"]
    group_id => "cs4371-logstash-v2"
    auto_offset_reset => "earliest"
    consumer_threads => 1
    decorate_events => "basic"
    codec => json
  }
}

filter {
  if ![entity] or ![label] or ![count] {
    drop {}
  }

  fingerprint {
    source => ["entity", "label"]
    concatenate_sources => true
    method => "SHA256"
    target => "[@metadata][document_id]"
  }

  mutate {
    convert => { "count" => "integer" }
  }
}

output {
  if [@metadata][kafka][topic] == "topic2-run01" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "cs4371-entities-run01"
      document_id => "%{[@metadata][document_id]}"
      action => "index"
      ilm_enabled => false
      data_stream => false
    }
  } else if [@metadata][kafka][topic] == "topic2" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "cs4371-entities"
      document_id => "%{[@metadata][document_id]}"
      action => "index"
      ilm_enabled => false
      data_stream => false
    }
  }
}
