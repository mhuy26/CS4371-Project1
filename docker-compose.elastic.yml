services:
  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.5
    restart: "no"

    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
      PIPELINE_WORKERS: "1"
      PIPELINE_BATCH_SIZE: "50"
      MONITORING_ENABLED: "false"

    volumes:
      - ./config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro

    depends_on:
      - elasticsearch
      - kafka

    mem_limit: 1200m

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    restart: "no"

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=768

    ports:
      - "127.0.0.1:5601:5601"

    depends_on:
      - elasticsearch

    mem_limit: 1200m

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    restart: "no"

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g

    ports:
      - "127.0.0.1:9200:9200"

    volumes:
      - ${GP1_DATA_DIR:-./docker-data}/elasticsearch:/usr/share/elasticsearch/data

    mem_limit: 2g

volumes:
  elasticsearch_data:
